name: wzry-skin-watch

on:
  schedule:
    # GitHub Actions 用 UTC。UTC 00:00 = 北京时间 08:00
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # 支持手动点一次，方便测试

permissions:
  contents: write         # 需要把 state.json 提交回仓库

concurrency:
  group: wzry-skin-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 检查皮肤上新 / 返场
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python watch.py

      - name: 保存监控状态
        run: |
          git config user.name "skin-watch-bot"
          git config user.email "skin-watch-bot@users.noreply.github.com"
          if ! git diff --quiet -- state.json; then
            git add state.json
            git commit -m "chore: 更新皮肤监控状态 [skip ci]"
            git push
          else
            echo "state.json 无变化"
          fi
