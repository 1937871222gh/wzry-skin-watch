name: wzry-skin-watch

on:
  schedule:
    # GitHub Actions 用 UTC。UTC 23:00 = 北京时间 07:00。
    # 免费定时任务在整点高峰期排队严重（实测能晚 4 小时），
    # 故意提前到北京 07:00 触发，排队之后实际大约 07:10 ~ 08:00 之间跑完。
    - cron: "0 23 * * *"
  workflow_dispatch:      # 支持手动点一次，方便测试
    inputs:
      probe_tid:
        description: "调试用：只抓这条公告正文并打印结果（留空＝正常跑一次监控）"
        required: false
        default: ""

permissions:
  contents: write         # 需要把 state.json 提交回仓库

concurrency:
  group: wzry-skin-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 检查皮肤上新 / 返场
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PROBE_TID: ${{ inputs.probe_tid }}
        run: python watch.py

      - name: 保存监控状态
        run: |
          git config user.name "skin-watch-bot"
          git config user.email "skin-watch-bot@users.noreply.github.com"
          # state.json 首次生成时是"未跟踪"文件，git diff 看不见它，必须先 add
          git add state.json
          if ! git diff --cached --quiet -- state.json; then
            git commit -m "chore: 更新皮肤监控状态 [skip ci]"
            git push
          else
            echo "state.json 无变化"
          fi
